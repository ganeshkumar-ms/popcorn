version: 0.2

env:
  variables:
    A3_CHECKER_URL: "http://a3checkr-env.eba-3mt4ctvn.ap-southeast-2.elasticbeanstalk.com"
    TARGET_URL: "https://example.com"
    REPORT_BUCKET: "3a-checkr"

phases:
  install:
    commands:
      - echo "Installing required tools"
      - yum install -y jq curl

  build:
    commands:
      - echo "Starting WCAG scan using 3A Checker"
      - echo "Target URL is $TARGET_URL"

      - |
        RESPONSE=$(curl -s -X POST "$A3_CHECKER_URL/api/pipeline-scan" \
          -H "Content-Type: application/json" \
          -d "{\"url\":\"$TARGET_URL\"}")

        echo "$RESPONSE" > wcag-result.json
        cat wcag-result.json

      - |
        STATUS=$(cat wcag-result.json | jq -r '.status')
        echo "WCAG scan status: $STATUS"

      - |
        echo "Downloading WCAG Excel report"
        curl -L "$A3_CHECKER_URL/download-excel" -o Accessibility_UI_Report.xlsx || true

      - |
        EXECUTION_ID=$(date +%Y%m%d-%H%M%S)
        echo "$EXECUTION_ID" > execution-id.txt

      - |
        echo "Uploading WCAG report to S3"
        aws s3 cp wcag-result.json "s3://$REPORT_BUCKET/$EXECUTION_ID/wcag-result.json" || true
        aws s3 cp Accessibility_UI_Report.xlsx "s3://$REPORT_BUCKET/$EXECUTION_ID/Accessibility_UI_Report.xlsx" || true

      - |
        echo "WCAG test completed"
        echo "Pipeline will continue to manual approval"
        echo "Approver should review report before deployment"

artifacts:
  files:
    - wcag-result.json
    - Accessibility_UI_Report.xlsx
    - execution-id.txt